<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR codes · Nardo</title>
<style>
:root{
  --bg:#F4F1FB; --ink:#1D1533; --muted:#6B6385; --card:#FFFFFF; --line:#E4DEF3;
  --roxo:#6D3FD9; --roxo-escuro:#3B1A8C; --roxo-claro:#EDE6FF;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#120B24; --ink:#F3EFFF; --muted:#A99FC7; --card:#1C1235; --line:#2F2354; --roxo:#9B7BFF; --roxo-claro:#2A1D52}
}
*{box-sizing:border-box;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(900px 500px at 50% -10%,rgba(109,63,217,.22),transparent 70%);
  -webkit-font-smoothing:antialiased;
}
main{max-width:980px;margin:0 auto;padding:72px 24px 56px}
header{text-align:center;margin-bottom:56px}
h1{font-size:clamp(34px,6vw,56px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
header p{margin-top:14px;font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:44ch;margin-inline:auto;line-height:1.45}
.grade{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
@media (max-width:640px){.grade{grid-template-columns:1fr}main{padding-top:48px}}
.qr{
  background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;
  box-shadow:0 1px 2px rgba(59,26,140,.06),0 18px 40px -18px rgba(59,26,140,.28);
}
.codigo{width:100%;max-width:240px;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px var(--line);transition:transform .25s ease}
.codigo svg{display:block;width:100%;height:100%}
.qr:hover .codigo{transform:scale(1.03)}
.nome{font-size:22px;font-weight:650;letter-spacing:-.02em}
.dest{font-size:13.5px;color:var(--muted);word-break:break-all;margin-top:4px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-size:15px;font-weight:600;
  padding:11px 20px;border-radius:999px;text-decoration:none;display:inline-block;
  transition:transform .15s ease,background .15s ease;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--roxo);outline-offset:3px}
.primario{background:var(--roxo);color:#fff}
.primario:hover{background:var(--roxo-escuro)}
.secundario{background:var(--roxo-claro);color:var(--roxo)}
.secundario:hover{filter:brightness(.97)}
footer{text-align:center;margin-top:48px;color:var(--muted);font-size:14px}
#redir{min-height:100vh;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted);font-size:17px}
#redir a{color:var(--roxo);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="redir"><p>Redirecionando…<br><a id="redir-link" href="#">Toque aqui se não abrir</a></p></div>

<main id="app">
  <header>
    <h1>Meus QR codes</h1>
    <p>Quatro códigos fixos. O destino de cada um pode mudar a qualquer momento, sem trocar o QR impresso.</p>
  </header>
  <section class="grade" id="grade"></section>
  <footer>nardo-dev.github.io/QR-CODES-GOOGLE</footer>
</main>

// Modo redirecionamento: quem escaneia o QR chega com ?go=N
const go = new URLSearchParams(location.search).get("go");
if (go && DESTINOS[go]) {
  document.getElementById("app").style.display = "none";
  const r = document.getElementById("redir");
  r.style.display = "grid";
  document.getElementById("redir-link").href = DESTINOS[go].url;
  location.replace(DESTINOS[go].url);
} else {
  const grade = document.getElementById("grade");
  Object.entries(DESTINOS).forEach(([id, d]) => {
    const el = document.createElement("article");
    el.className = "qr";
    el.innerHTML = `
      <div class="codigo" role="img" aria-label="QR code de ${d.nome}">${QR_SVG[id]}</div>
      <div>
        <div class="nome"></div>
        <div class="dest"></div>
      </div>
      <div class="acoes">
        <button class="btn primario" data-baixar="${id}">Baixar PNG</button>
        <a class="btn secundario" target="_blank" rel="noopener" data-testar="${id}">Testar</a>
      </div>`;
    el.querySelector(".nome").textContent = d.nome;
    el.querySelector(".dest").textContent = d.url.replace(/^https?:\/\//, "");
    el.querySelector("[data-testar]").href = BASE + "?go=" + id;
    grade.appendChild(el);
  });

  grade.addEventListener("click", e => {
    const b = e.target.closest("[data-baixar]");
    if (!b) return;
    const id = b.dataset.baixar;
    const img = new Image();
    const blob = new Blob([QR_SVG[id]], { type: "image/svg+xml" });
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 1200;
      const ctx = c.getContext("2d");
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, 1200, 1200);
      c.toBlob(png => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(png);
        a.download = "qr-" + DESTINOS[id].nome.toLowerCase().replace(/\s+/g, "-") + ".png";
        a.click();
        URL.revokeObjectURL(url);
      });
    };
    img.src = url;
  });
}
</script>
